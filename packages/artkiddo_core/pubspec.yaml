name: artkiddo_core
description: Offline-first ArtKiddo domain, local storage and neutral contracts.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  intl: ^0.20.2
  image: ^4.9.2
  camera: ^0.12.1
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  photo_view: ^0.15.0
  record: ^7.1.1
  just_audio: ^0.10.5
  audio_session: ^0.2.4
  flutter_staggered_grid_view: ^0.7.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.6
  build_runner: ^2.15.1

flutter:
  generate: true
  fonts:
    - family: Playpen Sans
      fonts:
        - asset: assets/fonts/PlaypenSans-Variable.ttf
